<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShipCheck</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚢</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="nav">
    <div class="nav-inner">
      <a class="brand" href="#/inbox"><span class="logo">🚢</span><span id="app-name">ShipCheck</span></a>
      <nav class="tabs" aria-label="Main">
        <a href="#/inbox" data-tab="inbox">Inbox</a>
        <a href="#/queue" data-tab="queue">Needs a person <span id="queue-count" class="count">0</span></a>
        <a href="#/new" data-tab="new">Try it</a>
        <a href="#/how" data-tab="how">How it works</a>
      </nav>
      <div id="ai-status" class="ai-chip"></div>
    </div>
  </header>

  <main id="app">
    <section class="page-head">
      <div id="eyebrow" class="eyebrow">Operations</div>
      <h1 id="page-title">Inbox</h1>
      <p id="page-sub" class="lede">Every email sorted. Every draft BL checked against its Shipping Instruction.</p>
    </section>

    <section id="stats" class="stats"></section>

    <section id="view-list" class="split">
      <div class="list-pane card">
        <div class="filters">
          <input id="search" type="search" placeholder="Search subject, sender or ID" aria-label="Search">
          <div id="cat-chips" class="chips"></div>
          <div id="status-chips" class="chips"></div>
        </div>
        <div id="list" class="list" role="list"></div>
      </div>
      <div id="detail" class="detail-pane card">
        <div class="empty">Pick an email to see what the system found.</div>
      </div>
    </section>

    <section id="view-new" class="card narrow" hidden>
      <div class="examples"><span>Quick examples</span>
        <button class="btn btn-soft" data-example="malay">Malay email</button>
        <button class="btn btn-soft" data-example="invoice">Invoice question</button>
        <button class="btn btn-soft" data-example="spam">Spam</button>
      </div>
      <form id="new-form">
        <label>From <input name="sender" value="customer@example.com"></label>
        <label>Subject <input name="subject" required placeholder="e.g. TO CONFIRM DOCS _ 5RSG-00133 _ CALLAO_PERU"></label>
        <label>Email text <textarea name="body" rows="6" placeholder="Hi, attached are the SI and draft BL. Please check and confirm."></textarea></label>
        <label>Attachments <span class="hint">Shipping Instruction + draft Bill of Lading · txt, pdf, docx or xlsx</span>
          <input name="files" type="file" multiple accept=".txt,.pdf,.docx,.xlsx"></label>
        <div class="form-foot"><button class="btn btn-primary" type="submit">Check this email ↗</button>
          <span id="new-status" class="muted"></span></div>
      </form>
    </section>

    <section id="view-how" class="card narrow" hidden></section>
  </main>

  <div id="modal" class="modal" hidden>
    <div class="modal-box">
      <button class="modal-close" aria-label="Close">×</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
